agent:
  task_name: ${task_name}

  pre_transform_image_size: 128
  cameras: [0]

  observation_type: "pixel"
  reward_type: "sparse"
  control: null

  image_size: 112
  action_repeat: 1
  frame_stack: 1
  num_updates: 1

  # Replay Buffer
  replay_buffer_capacity: 100000
  replay_buffer_load_dir: ./data/sim_data/real_data/${dataset_name}
  replay_buffer_keep_loaded: true

  model_dir: null
  model_step: null

  # Training
  agent: "dino_e2c_sac"
  init_steps: 0
  num_train_steps: 250000
  batch_size: 128
  hidden_dim: 1024

  # Evaluation
  eval_freq: 2000
  num_eval_episodes: 2

  # Critic
  critic_lr: 0.001
  critic_beta: 0.9
  critic_tau: 0.01
  critic_target_update_freq: 2

  # Actor
  actor_lr: 0.001
  actor_beta: 0.9
  actor_log_std_min: -10
  actor_log_std_max: 2
  actor_update_freq: 2

  # Encoder
  encoder_type: "pixel"
  encoder_feature_dim: 32
  encoder_tau: 0.05
  num_layers: 4
  num_filters: 32
  latent_dim: 128

  # SAC
  discount: 0.99
  init_temperature: 0.1
  alpha_lr: 0.0001
  alpha_beta: 0.5

  # Miscellaneous
  seed: 1
  work_dir: "./"
  save_tb: true
  save_buffer: false
  save_video: true
  save_sac: true
  detach_encoder: false

  # Regularization
  v_clip_low: -100
  v_clip_high: 100
  action_noise: null

  # Final density of demos sampled from replay buffer
  final_demo_density: 0.6

  data_augs: "crop"
  log_interval: 200
  pretrain_mode: null
  conv_layer_norm: true
  p_reward: 1.0

  # Reward Model
  save_online_image: false # save online vlm image, save image for train reward model
  online_data_save_path: ./online_reward_data
