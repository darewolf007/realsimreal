# task settings
frame_stack: 3
action_repeat: 1
discount: 0.99
# train settings
num_seed_frames: 4000
# eval
eval_every_frames: 10000
num_eval_episodes: 10
# snapshot
save_snapshot: true
# replay buffer
replay_buffer_size: 50000
replay_buffer_num_workers: 4
nstep: 3
batch_size: 256
# misc
seed: 1
device: cuda
save_video: true
save_train_video: false
use_tb: true
# experiment
experiment: exp
# agent
lr: 1e-4
feature_dim: 256
use_wandb: false
wandb_group: None
name: drqv2_stn_aug
use_traj: false
lr_stn: 1e-4
img_size: 128
use_depth: false
hint: none
num_train_frames: 801000
agent:
  cameras: [0]
  train_camera_name: ["sceneview", "moveview"] # choose camera for training
  frame_stack: ${frame_stack}
  image_size: ${img_size}
  class: algos.maniwhere.ManiAgent
  obs_shape: ??? # to be specified later
  action_shape: ??? # to be specified later
  device: "cuda"
  lr: 1e-4
  lr_stn: 1e-4
  critic_target_tau: 0.01
  update_every_steps: 2
  use_tb: true
  use_wandb: False
  num_expl_steps: 2000
  hidden_dim: 1024
  feature_dim: 256
  stddev_schedule: ${stddev_schedule}
  stddev_clip: 0.3
  temp: 1
  aux_coef: 1
  aux_l2_coef: 1
  aux_tcc_coef: 1
  aux_latency: 150000