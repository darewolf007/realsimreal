env_info:
# task setting
  task_name: "Pour can into a cup"
  subtask_language_info: ["Pick up the can", "Pour the can into the cup"]
  subtask_object_info: [["gripper", "can"], ["can", "cup"]]
  robot_init_qpos: [ -1.30487138, -1.69159379, 1.7358554 , -1.55820926, -1.51700765, -0.55815155]
# construct the task specific environment
  base_choose: "robot" # choose world base coordinate, robot or camera
  obj_pose_base: "robot" # init object pose base coordinate, robot or camera
  use_gravity: true
  has_renderer: false
  hand_eye_path: ./configs/robot/ur5_kinect_handeyecalibration_eye_on_base.yaml
  obj_info:
    labels: ["can", "cup"] # object label, get from task discription (LLM)
    poses: [[-0.2163775, 0.23622964, 0.58470762, -0.54217134, 0.26130275, 0.38524202, 0.69954249], [0.09150403, 0.18733008, 0.68197119, 0.48190924, 0.69741106,  0.42783199, -0.31359383]] # object 6-Dof pose, get from pose estimation
    grasp_obj: [True, False] # object proptery, graspable or static, get from task discription (LLM)

# simulation environment setting
  init_noise: false # add noise to init object pose
  init_translation_noise_bounds: [-0.005, 0.005]
  init_rotation_noise_bounds: [-5, 5]
  subtask_max_step: 50
  schedule_random: false # schedule random object pose

# camera setting
  camera_names: ["sceneview", "birdview", "frontview", "rightview", "robot0_eye_in_hand", "moveview"]
  camera_heights: [1536, 1536, 1536, 1536, 1536, 1536]
  camera_widths: [2048, 2048, 2048, 2048, 2048, 2048]
  camera_depths: true
  is_crop: false # object centered crop, not use now
  crop_image_size: [768, 768]
# robot setting
  use_joint_controller: false # simulation robot control type, true for joint control, false for end effector control
  use_euler: true # simulation end effector control type, true for euler control, false for quaternion control
  use_delta: true # simulation robot control type, true for delta control, false for absolute control
  control_freq: 20
  max_action: 4
# reward model setting
  reward_type: "sparse" # dense, sparse, online_sparse
  train_subtask: false # not use now
  add_additional_reward: false # for sd3g, not use now
  replay_data_save_path: ./data/sim_data/pt_data/  # for sd3g, not use now
  
# real_to_sim setting
  data_path: null # real world data path
  replay_buffer_load_dir: ./data/sim_data/pt_data/${dataset_name} # for replay and sd3g

